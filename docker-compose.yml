# =====================================================================
# CARLITOS - Docker Compose (development)
# Brings up: PostgreSQL, Redis, and the Go backend. Media is stored on local
# disk (a mounted volume) and served by the API's /media route — no object
# storage service needed. The three Vue frontends run via Vite on the host.
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: carlitos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carlitos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carlitos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-carlitos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carlitos} -d ${POSTGRES_DB:-carlitos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: carlitos_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carlitos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-carlitos}:${POSTGRES_PASSWORD:-carlitos_secret}@postgres:5432/${POSTGRES_DB:-carlitos}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      STORAGE_LOCAL_ROOT: /data/media
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8080/media}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-mock}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - mediadata:/data/media

volumes:
  pgdata:
  redisdata:
  mediadata:
